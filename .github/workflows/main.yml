name: test
on:
  pull_request:

defaults:
  run:
    shell: "bash"

concurrency:
  group: "${{ github.event_name != 'push' && github.run_id || 'continuous-deployment' }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - id: build
        run: "ci/fix-home ci/build.sh"
