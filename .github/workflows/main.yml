name: ci
on:
  pull_request:
    types: [ opened ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.head_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Init submodules
        run: python3 tests/test_main.py
